<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>rizhi 日知</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --border: #0f3460;
      --accent: #e94560;
      --text: #eaeaea;
      --muted: #888;
      --green: #4caf50;
      --orange: #ff9800;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.02em; }
    header h1 span { font-weight: 300; color: var(--muted); }
    #header-date { font-size: 0.78rem; color: var(--muted); }
    nav {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    nav button {
      flex: 1; padding: 0.7rem; background: none; border: none;
      color: var(--muted); cursor: pointer; font-size: 0.875rem;
      border-bottom: 2px solid transparent; transition: all 0.15s;
    }
    nav button.active { color: var(--accent); border-bottom-color: var(--accent); }
    main { padding: 1rem; max-width: 720px; margin: 0 auto; }
    .tab { display: none; }
    .tab.active { display: block; }

    /* paper card */
    .paper-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 0.75rem;
    }
    .paper-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; margin-bottom: 0.4rem; }
    .paper-title { font-size: 0.925rem; font-weight: 600; line-height: 1.45; }
    .score-badge {
      font-size: 0.7rem; font-weight: 700;
      padding: 2px 7px; border-radius: 10px;
      white-space: nowrap; flex-shrink: 0;
    }
    .score-high { background: var(--green); color: #000; }
    .score-mid  { background: var(--orange); color: #000; }
    .paper-authors { font-size: 0.78rem; color: var(--muted); margin-bottom: 0.5rem; }
    .paper-summary { font-size: 0.86rem; line-height: 1.6; color: #ccc; margin-bottom: 0.6rem; }
    .paper-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-bottom: 0.6rem; }
    .tag { font-size: 0.68rem; background: var(--border); padding: 2px 7px; border-radius: 8px; color: var(--muted); }
    .paper-link { font-size: 0.78rem; color: var(--accent); text-decoration: none; }
    .paper-link:hover { text-decoration: underline; }

    /* history */
    .date-group { margin-bottom: 1.5rem; }
    .date-label { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.5rem; padding-bottom: 0.25rem; border-bottom: 1px solid var(--border); }

    /* empty / loading */
    .empty { text-align: center; color: var(--muted); padding: 3rem 1rem; font-size: 0.9rem; line-height: 1.8; }

    /* notify prompt */
    .notify-banner {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 0.75rem 1rem;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      margin-bottom: 1rem;
    }
    .notify-banner p { font-size: 0.825rem; color: var(--muted); }

    /* settings */
    .settings-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 1rem; margin-bottom: 0.875rem;
    }
    .settings-card h3 {
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--muted); margin-bottom: 0.75rem;
    }
    .tag-list { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.75rem; min-height: 1.5rem; }
    .tag-rm {
      font-size: 0.78rem; background: var(--border); padding: 3px 10px;
      border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 4px;
      border: none; color: var(--text);
    }
    .tag-rm:hover { background: var(--accent); }
    .input-row { display: flex; gap: 0.5rem; }
    .input-row input {
      flex: 1; background: var(--bg); border: 1px solid var(--border);
      color: var(--text); padding: 0.45rem 0.65rem; border-radius: 6px; font-size: 0.85rem;
    }
    .input-row input:focus { outline: none; border-color: var(--accent); }
    .range-row { margin-bottom: 0.6rem; }
    .range-row label { font-size: 0.85rem; display: flex; justify-content: space-between; margin-bottom: 0.25rem; }
    .range-row input[type=range] { width: 100%; accent-color: var(--accent); }
    .number-row { margin-bottom: 0.6rem; }
    .number-row label { font-size: 0.85rem; display: block; margin-bottom: 0.25rem; }
    .number-row input[type=number] {
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      padding: 0.4rem 0.6rem; border-radius: 6px; width: 72px; font-size: 0.85rem;
    }
    .save-row { display: flex; justify-content: flex-end; margin-top: 0.5rem; }

    /* scan section */
    .scan-card { text-align: center; padding: 1.5rem 1rem; }
    .scan-status { margin-top: 0.75rem; font-size: 0.825rem; color: var(--muted); min-height: 1.5em; }
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.7s linear infinite;
      margin-right: 0.4rem; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* buttons */
    .btn { padding: 0.45rem 1rem; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { opacity: 0.88; }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-sm { padding: 0.35rem 0.7rem; font-size: 0.78rem; }
  </style>
</head>
<body>
  <header>
    <h1>rizhi <span>日知</span></h1>
    <span id="header-date"></span>
  </header>
  <nav>
    <button class="active" data-tab="today"   onclick="showTab(this)">Today</button>
    <button              data-tab="history" onclick="showTab(this)">History</button>
    <button              data-tab="settings" onclick="showTab(this)">Settings</button>
  </nav>
  <main>
    <div id="tab-today" class="tab active">
      <div id="notify-banner" class="notify-banner" style="display:none">
        <p>Enable push notifications to get alerted when new papers arrive.</p>
        <button class="btn btn-primary btn-sm" onclick="enableNotifications()">Enable</button>
      </div>
      <div id="today-papers"></div>
    </div>

    <div id="tab-history" class="tab">
      <div id="history-papers"></div>
    </div>

    <div id="tab-settings" class="tab">
      <div class="settings-card">
        <h3>Keywords</h3>
        <div id="keyword-tags" class="tag-list"></div>
        <div class="input-row">
          <input id="new-keyword" type="text" placeholder="Add keyword…"
                 onkeydown="if(event.key==='Enter') addItem('keyword')">
          <button class="btn btn-primary btn-sm" onclick="addItem('keyword')">Add</button>
        </div>
      </div>

      <div class="settings-card">
        <h3>Topics</h3>
        <div id="topic-tags" class="tag-list"></div>
        <div class="input-row">
          <input id="new-topic" type="text" placeholder="Add topic…"
                 onkeydown="if(event.key==='Enter') addItem('topic')">
          <button class="btn btn-primary btn-sm" onclick="addItem('topic')">Add</button>
        </div>
      </div>

      <div class="settings-card">
        <h3>Thresholds</h3>
        <div class="range-row">
          <label>Min score <span id="score-label">0.70</span></label>
          <input type="range" id="min-score" min="0.1" max="1.0" step="0.05" value="0.70"
                 oninput="document.getElementById('score-label').textContent=parseFloat(this.value).toFixed(2)">
        </div>
        <div class="number-row">
          <label>Max papers per run</label>
          <input type="number" id="max-papers" min="1" max="20" value="5">
        </div>
        <div class="save-row">
          <button class="btn btn-primary btn-sm" onclick="saveThresholds()">Save</button>
        </div>
      </div>

      <div class="settings-card scan-card">
        <h3>Manual scan</h3>
        <button id="scan-btn" class="btn btn-primary" onclick="triggerScan()">Scan Now</button>
        <div id="scan-status" class="scan-status"></div>
      </div>
    </div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
